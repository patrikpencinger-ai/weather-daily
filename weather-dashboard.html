<style>
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:20px;transition:background .2s}

#wrap.dark{--bg:#262624;--surf:#33322f;--tp:#ffffff;--ts:rgba(255,255,255,0.72);--bd:rgba(255,255,255,0.22);--cool:#7cc4f5}
#wrap.mobile{padding:14px}
#wrap.big{zoom:1.5;width:calc(100%/1.5);max-width:600px}
.card{background:var(--surf);border-radius:8px;padding:0.85rem 1rem;position:relative}
.lab{font-size:13px;color:var(--ts)}
.big-n{font-size:24px;font-weight:500}
.ctx{font-size:11.5px;color:var(--ts);line-height:1.45;margin-top:2px}
.aw{color:#D85A30;font-weight:500}
.ac{color:var(--cool);font-weight:500}
.dotA{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2caaf0;margin-right:5px;vertical-align:1px}
.dotB{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a64ce8;margin-right:5px;vertical-align:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 2rem}
#wrap.mobile .cards{grid-template-columns:1fr 1fr;gap:10px}
#wrap.mobile .ttl{font-size:16px}
.hd{font-size:16px;font-weight:500;letter-spacing:0.08em;margin:0 0 0.75rem}
.dark .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(0.92) saturate(0.7);}
#mapBox{position:relative;width:100%;height:300px;border-radius:10px;overflow:hidden;border:0.5px solid var(--bd);}
#mapSec.mapfull{position:fixed;inset:0;z-index:1000;background:var(--bg);margin:0;padding:10px;}
#mapSec.mapfull #mapBox{height:calc(100% - 46px);border-radius:8px;}
.stpop b{font-size:13px}.stpop button{margin-top:6px;background:#2caaf0;color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.lbtn:disabled{opacity:0.35;cursor:not-allowed;}
.info{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:1.4px solid var(--ts);font-size:8px;font-weight:700;line-height:1;color:var(--ts);cursor:help;font-style:normal;font-family:Georgia,serif;position:absolute;bottom:6px;right:8px;margin:0;}
.info:hover,.info:focus{border-color:var(--tp);color:var(--tp);}
.info .tip{display:none;cursor:auto;position:absolute;bottom:135%;right:-4px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;width:min(320px,78vw);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.55;color:var(--tp);z-index:60;text-align:left;font-weight:400;letter-spacing:0;text-transform:none;box-shadow:0 6px 18px rgba(0,0,0,0.18);white-space:normal;}
.info:hover .tip,.info:focus .tip{display:block;}
#locIn{background:var(--surf);color:var(--tp);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500;width:130px}
.state{background:var(--surf);border-radius:8px;padding:1.5rem 1.25rem;margin:0 0 1rem}
.state.center{text-align:center;padding:2rem 1rem}
.pulse{height:8px;width:140px;margin:14px auto 0;border-radius:999px;background:linear-gradient(90deg,var(--bd),var(--surf),var(--bd));background-size:200% 100%;animation:sweep 1.2s linear infinite;opacity:.5}
@keyframes sweep{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.hidden{display:none}
.rng{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap;align-items:center}
.rsep{width:1px;height:18px;background:var(--bd);margin:0 4px}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){if(typeof window.console==='undefined')window.console={};var noop=function(){};['log','info','warn','error','debug'].forEach(function(k){if(typeof console[k]!=='function')console[k]=console.log&&typeof console.log==='function'?console.log.bind(console):noop;});})();
const C={hi:'#D85A30',lo:'#084a8f',sky:'#2caaf0',sun:'#E0A53C',ok:'#1D9E75',warn:'#BA7517',bad:'#A32D2D',sea:'#0E7490',pres:'#6E8B3D',bbq:'#A0522D'};
const CMP={a:'#2caaf0',b:'#a64ce8'};
const BIOE=['🙂','😐','☹️'];
const ICON={sun:'☀️',partcloud:'⛅',cloud:'☁️',rain:'🌧️',storm:'⛈️',snow:'❄️',fog:'🌫️',wind:'💨'};
const DEFAULT_LOC={name:"Zagreb",lat:45.815,lon:15.982,station:"Zagreb-Gri\u010d (DHMZ)"};
const NORM_START='1991-01-01', NORM_END='2020-12-31', NORM_LBL='1991–2020', WIN=5;
const IN_CLAUDE=/claude|anthropic|usercontent/i.test((typeof location!=='undefined'&&location.hostname)||'');
const DEFAULT_RECENTS=['Zagreb','Primošten','Punat','Ugljan','New York'];
function titleCase(s){return (s||'').trim().split(/\s+/).map(w=>w.split('-').map(p=>/^[a-zà-ž]/i.test(p)?p.charAt(0).toLocaleUpperCase('hr')+p.slice(1).toLocaleLowerCase('hr'):p).join('-')).join(' ');}
let recents=DEFAULT_RECENTS.slice();
try{const s=localStorage.getItem('wd_recents');if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)recents=a.slice(0,5);}}catch(e){}
function saveRecents(){try{localStorage.setItem('wd_recents',JSON.stringify(recents));}catch(e){}}
let theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
let layout='',fontbig=false,lang='en',RANGE=7,CMODE=0,CONF=false,MOON=false,TIDE=false,PRES=false,BBQ=false;
let GEO_LOC=null;
let MAPL=null,MAPMARKS=[],MAP_LOC=null,CUR_LOC=null;
const MOONS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
function moonPh(iso){const synodic=29.530588853;const ref=Date.UTC(2000,0,6,18,14);const t=new Date(iso+'T12:00:00Z').getTime();const days=(t-ref)/86400000;return ((days%synodic)+synodic)%synodic/synodic;}
function moonIcon(iso){return MOONS[Math.round(moonPh(iso)*8)%8];}
function moonIllum(iso){return (1-Math.cos(2*Math.PI*moonPh(iso)))/2*100;}
function moonName(iso){return (LBL.moonNames||T.en.moonNames)[Math.round(moonPh(iso)*8)%8];}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uvLvl(v){return v<3?0:v<6?1:v<8?2:v<11?3:4;}
function polLvl(v){return v<10?0:v<50?1:2;}
let BRANGE='h';
function setBRange(v){BRANGE=v;markBtns();if(D&&D.bio)drawBio();}
function bioLvl(s){return s<=1?0:s<=3?1:2;}
function scoreBio(o){let s=0;const r=[];
 if(o.dp!=null){const a=Math.abs(o.dp);if(a>8){s+=2;r.push('rPress');}else if(a>4){s+=1;r.push('rPress');}}
 if(o.fl!=null){if(o.fl>=30){s+=2;r.push('rHeat');}else if(o.fl>=27){s+=1;r.push('rHeat');}if(o.fl<=-5){s+=1;r.push('rCold');}}
 if(o.rh!=null&&o.fl!=null&&o.rh>=85&&o.fl>=22){s+=1;r.push('rHum');}
 if(o.wind!=null&&o.wind>=40){s+=1;r.push('rWind');}
 if(o.cond==='storm'){s+=2;r.push('rStorm');}
 if(o.swing!=null&&o.swing>=14){s+=1;r.push('rSwing');}
 return{s:s,r:r};}
function toggleConf(){CONF=!CONF;markBtns();if(D)render();}
function toggleMoon(){MOON=!MOON;markBtns();if(D)render();}
function toggleTide(){TIDE=!TIDE;markBtns();if(D)render();}
function togglePres(){PRES=!PRES;markBtns();if(D)render();}
function toggleBbq(){BBQ=!BBQ;markBtns();if(D)render();}
let MP=false;
function toggleMP(){MP=!MP;markBtns();if(D)render();}
const MPBIO=['Lovely — dead lovely','Merely a flesh wound','Nobody expects this front!'];
const MPBADGE={g:'Always look on the bright side',y:"'Tis but a drizzle",r:'Run away! Run away!'};
const MPP={aRun:'Silly running',aHike:'The Quest',aSwim:'Swimming (no newts)',runGo:'proceed at a silly pace ~',runCare:'a flesh-wound forecast — gently ~',hikeGood:'a quest-worthy day',hikeRain:'the sky may taunt you a second time',uvNote:'the sun is not the Messiah — wear protection',swimNice:'lovely plumage\u2026 er, water',swimCool:'bracing; complain accordingly',swimCold:'colder than a certain parrot',swimStorm:'Run away! (from thunder)'};
function bioName(i){return MP?MPBIO[i]:LBL.bioLevels[i];}
const MPBBQ=['Bring out yer ribs!','A most agreeable grill','Passable, mostly','The coals shall taunt you','The fire is merely resting'];
const BBQI=['\uD83D\uDD25\uD83E\uDD69','\uD83C\uDF56','\uD83C\uDF2D','\uD83C\uDF62','\uD83E\uDDEF'];
function bbqTier(v){return v>=90?0:(v>=70?1:(v>=50?2:(v>=30?3:4)));}
function bbqName(i){return MP?MPBBQ[i]:LBL.bbqTiers[i];}
function bbqDay(x,bs){
 if(!x||x.hi==null||x.lo==null)return null;
 const evT=x.hi-0.3*(x.hi-x.lo);
 let v=100;
 v-=0.9*(x.pp??0);
 if(evT>26)v-=Math.min(40,4*(evT-26));else if(evT<18)v-=Math.min(40,4*(18-evT));
 if(x.w!=null&&x.w>20)v-=Math.min(20,x.w-20);
 if(bs!=null&&bs>0)v-=6*bs;
 if(x.cond==='storm')v=Math.min(v,15);
 return Math.max(1,Math.min(100,Math.round(v)));
}
function bbqDayArr(d,Wv){
 const bm={};
 if(d.bio&&d.bio.d)d.bio.d.forEach(b=>{bm[b.dt]=b.s;});
 return Wv.map(x=>bbqDay(x,bm[x.dt]));
}
function bbqScore(d){
 if(!d||!d.days||!d.days.length)return null;
 const d0=d.days[0];const H=d.hours||[];
 const ev=H.filter(x=>{const hh=parseInt(x.h,10);return hh>=17&&hh<=21;});

/* ---------- Marine: sea surface temperature ---------- */
function ensureMarine(loc){
 const k=loc.lat.toFixed(3)+','+loc.lon.toFixed(3);
 if(marineCache[k])return marineCache[k];
 marineCache[k]=(async()=>{
  const r=await tfetch('https://marine-api.open-meteo.com/v1/marine?latitude='+loc.lat+'&longitude='+loc.lon+'&hourly=sea_surface_temperature,sea_level_height_msl&forecast_days=7&timezone=auto',10000);
  if(!r.ok)return null;
  const j=await r.json();
  const tm=j.hourly&&j.hourly.time, vv=j.hourly&&j.hourly.sea_surface_temperature;
  const lv=j.hourly&&j.hourly.sea_level_height_msl;
  if(!tm||!vv)return null;
  const byDate={},byLvl={};let cur=null;
  for(let i=0;i<tm.length;i++){
   const d=tm[i].slice(0,10);
   const v=vv[i];
   if(v!=null&&isFinite(v)){
    if(cur===null&&new Date(tm[i])>=new Date())cur=v;
    (byDate[d]=byDate[d]||[]).push(v);
   }
   const l=lv?lv[i]:null;
   if(l!=null&&isFinite(l))(byLvl[d]=byLvl[d]||[]).push(l);
  }
  const dts=Object.keys(byDate).sort();
  if(!dts.length)return null;
  if(cur===null)cur=byDate[dts[0]][0];
  const tide=Object.keys(byLvl).sort().map(d=>({dt:d,hi:Math.round(Math.max.apply(null,byLvl[d])*100),lo:Math.round(Math.min.apply(null,byLvl[d])*100)}));
  return{cur:Math.round(cur*10)/10,days:dts.map(d=>({dt:d,t:Math.round((byDate[d].reduce((a,b)=>a+b,0)/byDate[d].length)*10)/10})),tide:tide};
 })().catch(()=>null);
 return marineCache[k];
}

/* ---------- Air quality: pollen ---------- */
function ensureAir(loc){
 const k=loc.lat.toFixed(3)+','+loc.lon.toFixed(3);
 if(airCache[k])return airCache[k];
 airCache[k]=(async()=>{
  const r=await tfetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+loc.lat+'&longitude='+loc.lon+'&hourly=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&forecast_days=1&timezone=auto',10000);
  if(!r.ok)return null;
  const j=await r.json();const h=j.hourly;if(!h||!h.time)return null;
  let idx=h.time.findIndex(t=>new Date(t)>=new Date());if(idx<0)idx=h.time.length-1;
  const keys=['alder','birch','grass','mugwort','olive','ragweed'];
  const list=[];
  keys.forEach(kk=>{const arr=h[kk+'_pollen'];const v=arr?arr[idx]:null;if(v!=null&&isFinite(v))list.push({k:kk,v:v});});
  if(!list.length)return null;
  let dom=list[0];list.forEach(x=>{if(x.v>dom.v)dom=x;});
  return{list:list,dom:dom};
 })().catch(()=>null);

}

/* ---------- Climatology: WMO-style normals ---------- */
function mmdd(d){return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function windowKeys(){
 const keys=[];const ref=new Date(2000,new Date().getMonth(),new Date().getDate());
 for(let o=-WIN;o<=WIN;o++){const d=new Date(ref);d.setDate(ref.getDate()+o);keys.push(mmdd(d));}
 return keys;
}
function sameDayISO(yearsBack){
 const d=new Date();const y=d.getFullYear()-yearsBack;
 let dd=d.getDate();const mo=d.getMonth()+1;
 if(mo===2&&dd===29)dd=28;
 return y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
}
function buildByDay(rawMax){
 const out={};
 for(let i=0;i<366;i++){
  const c=new Date(2000,0,1+i);const key=mmdd(c);
  const vals=[];
  for(let o=-WIN;o<=WIN;o++){const w=new Date(2000,0,1+i+o);const arr=rawMax[mmdd(w)];if(arr)for(const v of arr)vals.push(v);}
  if(vals.length)out[key]=vals.reduce((a,b)=>a+b,0)/vals.length;
 }
 return out;
}
function ensureClimo(loc){
 const k=loc.lat.toFixed(3)+','+loc.lon.toFixed(3);
 if(climoCache[k])return climoCache[k];
 climoCache[k]=(async()=>{
  const normP=tfetch('https://archive-api.open-meteo.com/v1/archive?latitude='+loc.lat+'&longitude='+loc.lon+
   '&start_date='+NORM_START+'&end_date='+NORM_END+
   '&daily=temperature_2m_max,temperature_2m_mean,precipitation_sum&timezone=auto',20000)
   .then(r=>{if(!r.ok)throw new Error('archive '+r.status);return r.json();});
  const lyDt=sameDayISO(1);
  const lyP=tfetch('https://archive-api.open-meteo.com/v1/archive?latitude='+loc.lat+'&longitude='+loc.lon+
   '&start_date='+lyDt+'&end_date='+lyDt+
   '&daily=temperature_2m_max,temperature_2m_mean,precipitation_sum&timezone=auto',12000)
   .then(r=>{if(!r.ok)throw new Error('archive '+r.status);return r.json();})
   .then(j=>({max:j.daily.temperature_2m_max[0],mean:j.daily.temperature_2m_mean[0],precip:j.daily.precipitation_sum[0]}))
   .catch(()=>null);
  const [norm,ly]=await Promise.all([normP,lyP]);
  const want=new Set(windowKeys());
  const dt=norm.daily;
  const mx=[],mn=[],pr=[],rawMax={};
  for(let i=0;i<dt.time.length;i++){
   const key=dt.time[i].slice(5);
   const vMax=dt.temperature_2m_max[i];
   if(vMax!=null)(rawMax[key]=rawMax[key]||[]).push(vMax);
   if(!want.has(key))continue;
   if(vMax!=null)mx.push(vMax);
   if(dt.temperature_2m_mean[i]!=null)mn.push(dt.temperature_2m_mean[i]);
   if(dt.precipitation_sum[i]!=null)pr.push(dt.precipitation_sum[i]);
  }
  if(!mx.length)throw new Error('no normals data');
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  return{ly:ly,avg:{max:mean(mx),mean:mean(mn),precip:mean(pr),n:mx.length},byDay:buildByDay(rawMax)};
 })();
 climoCache[k].catch(()=>{delete climoCache[k];});
 return climoCache[k];
}

function aiPrompt(loc,days){
 const wantHours=days<=7;
 return 'Search the web for live weather for '+loc+'. Prefer Croatian DHMZ / meteo.hr data when the location is in Croatia; identify the nearest official meteorological station to the address (e.g. for Zagreb that is typically Zagreb-Maksimir or Zagreb-Grič). Use 2-3 searches. Today is '+new Date().toDateString()+'. Respond with ONLY valid JSON, no markdown fences, no prose:\n'+

 'Rules: '+(wantHours?'hours = 8 entries at 3-hour steps from the next full hour, each with cond. ':'hours = empty array. ')+'days = exactly '+days+' entries starting today; beyond reliable horizons give trend-level estimates. cond one of: sun, partcloud, cloud, rain, storm, snow, fog, wind. Temps °C integers, wind km/h, pp = precipitation probability %. today = 3-6 word headline. rec = max 45 words per language, practical morning briefing for outdoor training, name best and worst windows. badge: g good, y mixed, r poor. src short.';
}
async function fetchAI(locName,range){

  method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
   messages:[{role:"user",content:aiPrompt(locName,range)}],
   tools:[{type:"web_search_20250305",name:"web_search"}]})
 });

function buildVersus(l){
 if(!cmp())return'';
 const hrv=l==='hr';
 const An=esc(D.loc||locA()),Bn=esc(D2.loc||selB);
 let a=0,b=0;const ra=[],rb=[];

 if(d0.hi!=null&&e0.hi!=null&&d0.hi!==e0.hi){const w=d0.hi>e0.hi;(w?ra:rb).push((hrv?'toplije (+':'warmer (+')+Math.abs(d0.hi-e0.hi)+'\u00B0)');w?a++:b++;}
 if((d0.pp??0)!==(e0.pp??0)){const w=(d0.pp??0)<(e0.pp??0);(w?ra:rb).push(hrv?'su\u0161e':'drier');w?a++:b++;}
 const wA=D.now&&D.now.wind,wB=D2.now&&D2.now.wind;
 if(wA!=null&&wB!=null&&Math.abs(wA-wB)>=8){const w=wA<wB;(w?ra:rb).push(hrv?'mirniji vjetar':'calmer wind');w?a++:b++;}
 if(D.sea&&D2.sea){const w=D.sea.cur>D2.sea.cur;(w?ra:rb).push((hrv?'toplije more (':'warmer sea (')+(w?D.sea.cur:D2.sea.cur)+'\u00B0)');w?a++:b++;}
 else if(D.sea&&!D2.sea){ra.push(hrv?'uop\u0107e ima more':'has a sea at all');a++;}
 else if(D2.sea&&!D.sea){rb.push(hrv?'uop\u0107e ima more':'has a sea at all');b++;}
 if(D.bio&&D2.bio&&D.bio.d&&D2.bio.d&&D.bio.d.length&&D2.bio.d.length){const sa=D.bio.d[0].s,sb=D2.bio.d[0].s;if(sa!==sb){const w=sa<sb;(w?ra:rb).push(hrv?'ugodniji biometeo':'kinder biometeo');w?a++:b++;}}
 if(D.air&&D2.air&&D.air.dom&&D2.air.dom){const va=D.air.dom.v,vb=D2.air.dom.v;if(Math.abs(va-vb)>=5){const w=va<vb;(w?ra:rb).push(hrv?'manje peludi':'less pollen');w?a++:b++;}}
 (function(){const qa=bbqScore(D),qb=bbqScore(D2);if(qa&&qb&&Math.abs(qa.v-qb.v)>=8){const w=qa.v>qb.v;(w?ra:rb).push((hrv?'bolji ro\u0161tilj (':'better BBQ (')+(w?qa.v:qb.v)+')');w?a++:b++;}})();
 if(a===0&&b===0)return'';
 if(a===b){
  return MP?('The great '+An+' v '+Bn+' weather-off ends '+a+':'+b+' \u2014 a tie. We are the knights who say\u2026 both.')
   :(hrv?('Neodlu\u010Deno '+a+':'+b+' \u2014 danas birajte srcem.'):('A '+a+':'+b+' tie \u2014 today, choose with your heart.'));
 }
 const aw=a>b;
 const win=aw?An:Bn,lose=aw?Bn:An,wr=aw?ra:rb,lr=aw?rb:ra,sc=Math.max(a,b)+':'+Math.min(a,b);
 if(MP){
  let t='And now for something completely different \u2014 the great '+An+' v '+Bn+' weather-off. ';
  t+=win+' triumphs '+sc+(wr.length?(': '+wr.join(', ')):'')+'. ';
  t+=lose+(lr.length?(' clings to '+lr.join(', ')+' and'):'')+' is not quite dead yet.';
  return t;
 }
 return hrv?
  ('Verdikt: '+win+' vodi '+sc+(wr.length?(' \u2014 '+wr.join(', ')):'')+'. '+(lr.length?(lose+' uzima bod za: '+lr.join(', ')+'.'):(lose+' danas \u010Dasno gubi.'))):
  ('Verdict: '+win+' leads '+sc+(wr.length?(' \u2014 '+wr.join(', ')):'')+'. '+(lr.length?(lose+' takes points for: '+lr.join(', ')+'.'):(lose+' loses honourably today.')));
}

function buildFact(d,l){
 const hrv=l==='hr';
 const cand=[];
 const d0=(d.days&&d.days[0])||null;
 const mo=new Date().getMonth();
 if(d0&&d.climo&&d.climo.byDay){
  const nm=d.climo.byDay[d0.dt.slice(5)];
  if(nm!=null){
   const an=d0.hi-nm;
   if(Math.abs(an)>=2)cand.push({sc:Math.abs(an),t:hrv?
    ('Današnji maksimum od '+d0.hi+'° je '+sgn(an,'°',1)+' u odnosu na normalu 1991–2020 za ovaj datum ('+nm.toFixed(1)+'°) — izrazito '+(an>0?'topao':'hladan')+' dan za sredinu '+MOG.hr[mo]+'.')
   :("Today's high of "+d0.hi+'° runs '+sgn(an,'°',1)+' against the 1991–2020 normal for this date ('+nm.toFixed(1)+'°) — a distinctly '+(an>0?'warm':'cool')+' day for mid-'+MOG.en[mo]+'.')});
  }
 }
 if(d.sun){
  const now=new Date();const y=now.getFullYear();
  const cands=[new Date(y,5,21),new Date(y,11,21),new Date(y+1,5,21)];
  let nx=cands.find(c=>c>=new Date(y,now.getMonth(),now.getDate()));
  const nDays=Math.round((nx-now)/86400000);
  const summer=nx.getMonth()===5;
  const H=Math.floor(d.sun.len/60),Mn=d.sun.len%60;
  const dm=d.sun.dmin;
  cand.push({sc:(nDays<=14?3.5:2.2),t:hrv?
   ('Danas '+H+'h '+Mn+'m dnevnog svjetla (sunce '+d.sun.rise+'–'+d.sun.set+'); dani se '+(dm>=0?'produljuju':'skraćuju')+' za ~'+Math.abs(dm)+' min/dan — još '+nDays+' dana do '+(summer?'ljetnog':'zimskog')+' solsticija.')
  :('Daylight today: '+H+'h '+Mn+'m (sun '+d.sun.rise+'–'+d.sun.set+'); days are '+(dm>=0?'lengthening':'shortening')+' by ~'+Math.abs(dm)+' min/day — '+nDays+' days to the '+(summer?'summer':'winter')+' solstice.')});
 }
 if(d.days&&d.days.length){
  for(const x of d.days.slice(0,14)){
   const idx=Math.round(moonPh(x.dt)*8)%8;
   if(idx===4||idx===0){
    const full=idx===4;
    const clear=(x.cond==='sun'||x.cond==='partcloud');
    cand.push({sc:full?2.4:1.8,t:hrv?
     ((full?'Puni mjesec':'Mlađak')+' pada u '+dayLab(x.dt)+(full&&clear?' — uz vedru prognozu, večer kao stvorena za promatranje.':'.'))
    :((full?'Full moon':'New moon')+' lands on '+dayLab(x.dt)+(full&&clear?' — and skies look clear, a prime evening for moonwatching.':'.'))});
    break;
   }
  }
  const allDry=d.days.every(x=>(x.pp??0)===0);
  if(allDry&&d.days.length>=7)cand.push({sc:2.6,t:hrv?
   ('Ni kapi na vidiku — 0% oborina kroz svih '+d.days.length+' dana, neuobičajeno suh niz za '+MOG.hr[mo]+'.')
  :('Not a drop in sight — 0% precipitation across all '+d.days.length+' days, an unusually dry stretch for '+MOG.en[mo]+'.')});
 }
 if(d.pres&&d.pres.d24!=null&&Math.abs(d.pres.d24)>=6)cand.push({sc:Math.abs(d.pres.d24)/2.5,t:hrv?
  ('Tlak se u 24 sata promijenio za '+sgn(d.pres.d24,' hPa',1)+' — upravo takve promjene meteoropati prvi osjete.')
 :('Pressure has shifted '+sgn(d.pres.d24,' hPa',1)+' in 24 hours — exactly the kind of swing weather-sensitive people feel first.')});
 if(d.sea&&d.sea.days&&d.sea.days.length>=2){
  const dl2=d.sea.days[d.sea.days.length-1].t-d.sea.days[0].t;
  if(Math.abs(dl2)>=1.2)cand.push({sc:Math.abs(dl2),t:hrv?
   ('More se ovdje brzo '+(dl2>0?'grije':'hladi')+': promjena od '+sgn(dl2,'°',1)+' unutar jednog tjedna.')
  :('The sea here is '+(dl2>0?'warming':'cooling')+' quickly: a '+sgn(dl2,'°',1)+' change forecast within a single week.')});
 }
 if(!cand.length)return null;
 cand.sort((a,b)=>b.sc-a.sc);
 return cand[0].t;
}

 if(MOON)ds.push({type:'line',label:'ill',data:Wd.map(d=>Math.round(moonIllum(d.dt))),borderColor:C.sun,backgroundColor:C.sun,borderWidth:2,pointRadius:3,pointBorderColor:ptb,pointBorderWidth:1,tension:0.3,yAxisID:'y'});
 let tH=null,tL=null;
 if(tideOk){
  const tmap={};D.sea.tide.forEach(t=>{tmap[t.dt]=t;});
  tH=Wd.map(x=>tmap[x.dt]?tmap[x.dt].hi:null);
  tL=Wd.map(x=>tmap[x.dt]?tmap[x.dt].lo:null);
  ds.push({type:'line',label:'tideHi',data:tH,borderColor:C.sea,borderWidth:2,pointRadius:3,pointBorderColor:ptb,pointBorderWidth:1,tension:0.3,spanGaps:false,yAxisID:'yT'});
  ds.push({type:'line',label:'tideLo',data:tL,borderColor:C.sea+'99',borderDash:[6,4],borderWidth:2,pointRadius:3,pointBorderColor:ptb,pointBorderWidth:1,tension:0.3,spanGaps:false,yAxisID:'yT'});
 }
 mtCh=new Chart(document.getElementById('mt'),{
  data:{labels:Wd.map(x=>vdense?String(new Date(x.dt+"T12:00").getDate()):dayLab(x.dt)),datasets:ds},
  options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:30}},
   plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{
    if(c.dataset.label==='ill')return moonName(Wd[c.dataIndex].dt)+' \u00B7 '+c.parsed.y+'%';
    return (c.dataset.label==='tideHi'?LBL.tideHi:LBL.tideLo)+': '+c.parsed.y+' cm';}}}},
   scales:{
    x:{grid:{display:false},ticks:{autoSkip:vdense,color:txt,font:{size:layout==='mobile'?8:(dense?9:11)}}},
    y:{display:MOON,min:0,max:108,grid:{color:MOON?grid:'rgba(0,0,0,0)'},ticks:{color:txt,stepSize:25,callback:v=>v<=100?v+'%':''}},
    yT:{display:!!tideOk,position:'right',grace:'20%',grid:{drawOnChartArea:!MOON},ticks:{color:txt,callback:v=>Math.round(v)+' cm'}}
   }},
  plugins:[bgPlug,{id:'mtlab',afterDatasetsDraw(ch){
   const{ctx}=ch;ctx.save();ctx.textAlign='center';
   const M=layout==='mobile';
   if(MOON){
    const ii=ch.data.datasets.findIndex(dd=>dd.label==='ill');
    if(ii>=0){ctx.font=(M?'11px ':'13px ')+'sans-serif';
     ch.getDatasetMeta(ii).data.forEach((pt,i)=>{if(i%step!==0)return;ctx.fillText(moonIcon(Wd[i].dt),pt.x,pt.y-10);});}
   }
   if(tH){
    const ts=dense?2:1;ctx.font=(M?'500 7px ':'500 8px ')+'sans-serif';
    const hiI=ch.data.datasets.findIndex(dd=>dd.label==='tideHi');
    const loI=ch.data.datasets.findIndex(dd=>dd.label==='tideLo');
    if(hiI>=0)ch.getDatasetMeta(hiI).data.forEach((pt,i)=>{const v=tH[i];if(v==null||i%ts!==0)return;ctx.fillStyle=halo;ctx.fillRect(pt.x-12,pt.y-16,24,9);ctx.fillStyle=C.sea;ctx.fillText(v,pt.x,pt.y-9);});
    if(loI>=0)ch.getDatasetMeta(loI).data.forEach((pt,i)=>{const v=tL[i];if(v==null||i%ts!==0)return;ctx.fillStyle=halo;ctx.fillRect(pt.x-12,pt.y+7,24,9);ctx.fillStyle=C.sea;ctx.fillText(v,pt.x,pt.y+14);});
   }
   ctx.restore();}}]
 });
}

function applyTheme(t){theme=t;calc();document.getElementById('wrap').classList.toggle('dark',t==='dark');document.body.style.background=BG;markBtns();if(D)render();}
function setLang(l){
 lang=l;LBL=T[l];
 document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(LBL[k])el.textContent=LBL[k];});
 markBtns();
 if(D)render(); else if(lastErrs&&!document.getElementById('error').classList.contains('hidden'))showError();
}
function applyResponsive(){
 const want=window.innerWidth<560?'mobile':'desktop';
 if(layout===want)return;layout=want;
 document.getElementById('wrap').classList.toggle('mobile',want==='mobile');
 document.getElementById('wkwrap').style.height=want==='mobile'?'300px':'340px';
 document.getElementById('hrwrap').style.height=want==='mobile'?'220px':'260px';
 document.getElementById('seawrap').style.height=want==='mobile'?'170px':'200px';
 document.getElementById('mtwrap').style.height=want==='mobile'?'160px':'190px';
 document.getElementById('biowrap').style.height=want==='mobile'?'150px':'170px';
 if(D)render();
 markBtns();
}
function toggleFont(){fontbig=!fontbig;document.getElementById('wrap').classList.toggle('big',fontbig);markBtns();requestAnimationFrame(()=>{[hourlyCh,weekCh,seaCh,mtCh,bioCh].forEach(c=>{if(c){c.resize();c.update();}});});}
function markBtns(){
 const Dk=theme==='dark';
 const actBg=Dk?'#e8e8e6':'#444441',actFg=Dk?'#262624':'#ffffff',inFg=Dk?'#e8e8e6':'#2c2c2a';
 const bd=Dk?'1px solid rgba(255,255,255,0.35)':'1px solid rgba(0,0,0,0.4)';
 const states={'btn-en':lang==='en','btn-hr':lang==='hr','btn-lt':theme==='light','btn-dk':theme==='dark','btn-fs':fontbig,'btn-rf':false,'btn-cf':CONF,'btn-pr':PRES,'btn-mp':MP,'btn-bbq':BBQ,
  'btn-r3':RANGE===3,'btn-r7':RANGE===7,'btn-r14':RANGE===14,'btn-r30':RANGE===30,
  'btn-c0':CMODE===0,'btn-c1':CMODE===1,'btn-c2':CMODE===2,'btn-moon':MOON,'btn-tide':TIDE,'btn-bh':BRANGE==='h','btn-b3':BRANGE===3,'btn-b7':BRANGE===7};
 const paint=(b,on)=>{
  b.style.background=on?actBg:'transparent';b.style.color=on?actFg:inFg;b.style.border=bd;
  b.style.borderRadius='8px';b.style.padding='4px 10px';b.style.fontSize='12px';b.style.fontWeight='500';b.style.cursor='pointer';b.style.boxShadow='none';
 };
 Object.entries(states).forEach(([id,on])=>{const b=document.getElementById(id);if(b)paint(b,on);});
 const curr=locA().toLowerCase();
 document.querySelectorAll('.locbtn').forEach(b=>{
  const nm=(b.dataset.n||'').toLowerCase();
  const isA=nm===curr, isB=!!(selB&&nm===selB.toLowerCase());
  paint(b,isA||isB);
  if(isB)b.style.boxShadow='0 0 0 2px '+CMP.b;
  if(isA&&selB)b.style.boxShadow='0 0 0 2px '+CMP.a;
 });
}
applyTheme(theme);setLang('en');renderRecents();applyResponsive();
let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(applyResponsive,150);});
const STATIONS=[["Zagreb-Maksimir",45.82,16.03],["Zagreb-Gri\u010d",45.81,15.97],["Puntijarka",45.91,15.97],["Krapina",46.16,15.88],["Vara\u017edin",46.28,16.36],["\u010cakovec",46.39,16.43],["Bjelovar",45.90,16.85],["Kri\u017eevci",46.02,16.55],["Daruvar",45.60,17.23],["Osijek",45.50,18.56],["Slavonski Brod",45.16,18.01],["Po\u017eega",45.33,17.68],["Gradi\u0161te",45.15,18.70],["Sisak",45.50,16.37],["Karlovac",45.49,15.56],["Ogulin",45.26,15.23],["Parg",45.60,14.63],["Delnice",45.40,14.80],["Gospi\u0107",44.55,15.37],["Zavi\u017ean",44.82,14.98],["Senj",44.99,14.90],["Rijeka",45.34,14.44],["Crikvenica",45.18,14.69],["Mali Lo\u0161inj",44.53,14.47],["Rab",44.76,14.76],["Pula",44.87,13.85],["Pore\u010d",45.23,13.60],["Pazin",45.24,13.94],["Zadar",44.13,15.21],["Knin",44.04,16.20],["\u0160ibenik",43.73,15.91],["Split-Marjan",43.51,16.43],["Sinj",43.70,16.64],["Imotski",43.45,17.22],["Makarska",43.30,17.02],["Hvar",43.17,16.44],["Komi\u017ea",43.05,16.09],["Plo\u010de",43.06,17.43],["Dubrovnik",42.65,18.09],["Lastovo",42.77,16.90]];
function havKm(a,b,c,d){const R=6371,p=Math.PI/180;const x=(c-a)*p,y=(d-b)*p;const h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
let LEAF_STATE='idle';
function loadLeaflet(){
 if(LEAF_STATE!=='idle')return;
 LEAF_STATE='loading';
 try{
  const css=document.createElement('link');
  css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
  document.head.appendChild(css);
  const js=document.createElement('script');
  js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  js.onload=function(){LEAF_STATE='ready';try{updateMap();}catch(e){console.log('map init failed:',e);}};
  js.onerror=function(){LEAF_STATE='failed';document.getElementById('mapSec').classList.add('hidden');};
  document.head.appendChild(js);
 }catch(e){LEAF_STATE='failed';}
}
function initMapIfNeeded(){
 if(MAPL||typeof L==='undefined')return;
 try{
  MAPL=L.map('mapBox',{scrollWheelZoom:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'\u00A9 OpenStreetMap'}).addTo(MAPL);
 }catch(e){MAPL=null;}
}
function updateMap(){
 const sec=document.getElementById('mapSec');
 if(typeof L==='undefined'){
  if(LEAF_STATE==='idle')setTimeout(loadLeaflet,400);
  if(LEAF_STATE==='failed')sec.classList.add('hidden');
  return;
 }
 sec.classList.remove('hidden');
 document.getElementById('mapNote').textContent=LBL.mapNote;
 initMapIfNeeded();if(!MAPL)return;
 const c=CUR_LOC||DEFAULT_LOC;
 MAPMARKS.forEach(m=>MAPL.removeLayer(m));MAPMARKS=[];
 const near=STATIONS.map(st=>({n:st[0],lat:st[1],lon:st[2],d:havKm(c.lat,c.lon,st[1],st[2])})).sort((a,b)=>a.d-b.d).slice(0,10);
 const me=L.circleMarker([c.lat,c.lon],{radius:7,color:'#D85A30',fillColor:'#D85A30',fillOpacity:0.9});
 me.bindPopup('<div class="stpop"><b>'+esc(c.name||'')+'</b></div>');me.addTo(MAPL);MAPMARKS.push(me);
 near.forEach((st,i)=>{
  const mk=L.circleMarker([st.lat,st.lon],{radius:6,color:'#2caaf0',fillColor:'#2caaf0',fillOpacity:0.85});
  mk.bindPopup('<div class="stpop"><b>'+esc(st.n)+'</b><br>'+st.d.toFixed(0)+' km<br><button onclick="useStation('+STATIONS.findIndex(x=>x[0]===st.n)+')">'+esc(LBL.useSt)+'</button></div>');
  mk.addTo(MAPL);MAPMARKS.push(mk);
 });
 const grp=L.featureGroup(MAPMARKS);
 try{MAPL.fitBounds(grp.getBounds().pad(0.25));}catch(e){MAPL.setView([c.lat,c.lon],8);}
}
function useStation(i){
 const st=STATIONS[i];if(!st)return;
 MAP_LOC={name:st[0],lat:st[1],lon:st[2],station:st[0]+' (DHMZ)'};
 if(MAPL)MAPL.closePopup();
 document.getElementById('mapSec').classList.remove('mapfull');
 selB=null;D2=null;
 document.getElementById('locIn').value=MAP_LOC.name;
 renderRecents();loadData();
 document.getElementById('wrap').scrollIntoView({behavior:'smooth'});
}
function mapMax(){
 const sec=document.getElementById('mapSec');
 sec.classList.toggle('mapfull');
 setTimeout(()=>{if(MAPL)MAPL.invalidateSize();},80);
}
function requestGeo(){
 return new Promise(res=>{
  try{
   if(!navigator.geolocation){res(null);return;}
   let done=false;
   const tt=setTimeout(()=>{if(!done){done=true;res(null);}},5000);
   navigator.geolocation.getCurrentPosition(async function(pos){
    clearTimeout(tt);if(done)return;done=true;
    const la=pos.coords.latitude,lo=pos.coords.longitude;
    let nm=null;
    try{
     const r=await tfetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+la+'&lon='+lo,6000);
     const j=await r.json();const a=j.address||{};
     nm=a.city||a.town||a.village||a.municipality||a.suburb||a.county||null;
    }catch(e){}
    const label=nm?titleCase(nm):LBL.myLoc;
    res({name:label,lat:la,lon:lo,station:label+' \u00B7 GPS '+la.toFixed(3)+', '+lo.toFixed(3)});
   },function(){clearTimeout(tt);if(!done){done=true;res(null);}},{timeout:4500,maximumAge:600000});
  }catch(e){res(null);}
 });
}
async function goGeo(){
 const g=await requestGeo();
 if(!g)return;
 GEO_LOC=g;selB=null;D2=null;
 document.getElementById('locIn').value=g.name;
 loadData();
}

function initLoc(){
 requestGeo().then(g=>{
  if(g){GEO_LOC=g;document.getElementById('locIn').value=g.name;}
  loadData();
 });
}
initLoc();
